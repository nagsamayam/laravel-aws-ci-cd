name: Build and Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-and-scan:
    name: Build & Scan ${{ matrix.name }}

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: app
            dockerfile: docker/php/Dockerfile
            image: ghcr.io/${{ github.repository }}
            candidate_image: ghcr.io/${{ github.repository }}:candidate-${{ github.event.workflow_run.head_sha }}
            cache_image: ghcr.io/${{ github.repository }}:buildcache

          - name: nginx
            dockerfile: docker/nginx/Dockerfile
            image: ghcr.io/${{ github.repository }}-nginx
            candidate_image: ghcr.io/${{ github.repository }}-nginx:candidate-${{ github.event.workflow_run.head_sha }}
            cache_image: ghcr.io/${{ github.repository }}-nginx:buildcache

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}

          push: true

          tags: |
            ${{ matrix.candidate_image }}

          cache-from: |
            type=registry,ref=${{ matrix.cache_image }}

          cache-to: |
            type=registry,ref=${{ matrix.cache_image }},mode=max

          provenance: mode=max
          sbom: true

      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.candidate_image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 0

      - name: Upload ${{ matrix.name }} Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Enforce Trivy security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.candidate_image }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 1

  publish:
    name: Promote Images

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    needs:
      - build-and-scan

    runs-on: ubuntu-latest

    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote application image
        run: |
          docker pull \
            "${REGISTRY}/${GITHUB_REPOSITORY}:candidate-${IMAGE_TAG}"

          docker tag \
            "${REGISTRY}/${GITHUB_REPOSITORY}:candidate-${IMAGE_TAG}" \
            "${REGISTRY}/${GITHUB_REPOSITORY}:${IMAGE_TAG}"

          docker push \
            "${REGISTRY}/${GITHUB_REPOSITORY}:${IMAGE_TAG}"

      - name: Promote Nginx image
        run: |
          docker pull \
            "${REGISTRY}/${GITHUB_REPOSITORY}-nginx:candidate-${IMAGE_TAG}"

          docker tag \
            "${REGISTRY}/${GITHUB_REPOSITORY}-nginx:candidate-${IMAGE_TAG}" \
            "${REGISTRY}/${GITHUB_REPOSITORY}-nginx:${IMAGE_TAG}"

          docker push \
            "${REGISTRY}/${GITHUB_REPOSITORY}-nginx:${IMAGE_TAG}"