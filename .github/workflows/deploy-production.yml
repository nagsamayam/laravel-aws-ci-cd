name: Deploy Production

on:
  workflow_run:
    workflows: ["Build and Publish"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

      - name: Checkout deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy production Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "compose.prod.yaml"
          target: "/tmp/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/laravel-aws-ci-cd

            echo "Loading DB_ROOT_PASSWORD from AWS Parameter Store..."
            export DB_ROOT_PASSWORD="$(
              aws ssm get-parameter \
                --name MYSQL_ROOT_PASSWORD \
                --query 'Parameter.Value' \
                --output text
            )"

            if [ -z "${DB_ROOT_PASSWORD}" ]; then
              echo "ERROR: DB_ROOT_PASSWORD was not loaded from Parameter Store."
              exit 1
            fi

            echo "DB_ROOT_PASSWORD loaded successfully."

            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}

            echo "Deploying IMAGE_TAG=${IMAGE_TAG}"

            echo "Installing new production Compose file..."

            mv \
              /tmp/compose.prod.yaml \
              compose.prod.yaml.new

            echo "Validating new production Compose file..."

            docker compose \
              -f compose.prod.yaml.new \
              config -q

            echo "Production Compose file validation passed."

            mv \
              compose.prod.yaml.new \
              compose.prod.yaml

            echo "Production Compose file activated."

            PREVIOUS_IMAGE=$(
              docker compose \
                -f compose.prod.yaml \
                ps -q app |
              xargs -r docker inspect \
                --format='{{.Config.Image}}' \
                2>/dev/null || true
            )

            PREVIOUS_TAG=$(echo "${PREVIOUS_IMAGE}" | awk -F: '{print $NF}')

            echo "Previous IMAGE_TAG=${PREVIOUS_TAG}"

            echo "Pulling application images..."

            docker compose \
              -f compose.prod.yaml \
              pull

            echo "Running database migrations..."

            docker compose \
              -f compose.prod.yaml \
              run --rm app \
              php artisan migrate --force

            echo "Starting application..."

            docker compose \
              -f compose.prod.yaml \
              up -d --remove-orphans

            echo "Optimizing Laravel..."

            docker compose \
              -f compose.prod.yaml \
              exec -T app \
              php artisan optimize

            echo "Waiting for application health..."

            HEALTHY=false

            for i in {1..30}; do
              if curl -fsS http://localhost/up > /dev/null; then
                echo "Health check passed"
                HEALTHY=true
                break
              fi

              echo "Health check attempt $i failed"
              sleep 2
            done

            if [ "$HEALTHY" = true ]; then
              docker compose \
                -f compose.prod.yaml \
                ps

              exit 0
            fi

            echo "Deployment health check failed"

            docker compose \
              -f compose.prod.yaml \
              ps

            docker compose \
              -f compose.prod.yaml \
              logs --tail=100 app

            docker compose \
              -f compose.prod.yaml \
              logs --tail=100 nginx

            if [ -z "${PREVIOUS_TAG}" ]; then
              echo "No previous IMAGE_TAG available. Cannot rollback."
              exit 1
            fi

            echo "Rolling back to ${PREVIOUS_TAG}"

            export IMAGE_TAG=${PREVIOUS_TAG}

            docker compose \
              -f compose.prod.yaml \
              pull

            docker compose \
              -f compose.prod.yaml \
              up -d --remove-orphans

            docker compose \
              -f compose.prod.yaml \
              exec -T app \
              php artisan optimize

            echo "Waiting for rollback health..."

            for i in {1..30}; do
              if curl -fsS http://localhost/up > /dev/null; then
                echo "Rollback health check passed"

                docker compose \
                  -f compose.prod.yaml \
                  ps

                exit 1
              fi

              echo "Rollback health check attempt $i failed"
              sleep 2
            done

            echo "Rollback health check failed"

            docker compose \
              -f compose.prod.yaml \
              ps

            docker compose \
              -f compose.prod.yaml \
              logs --tail=100 app

            docker compose \
              -f compose.prod.yaml \
              logs --tail=100 nginx

            exit 1