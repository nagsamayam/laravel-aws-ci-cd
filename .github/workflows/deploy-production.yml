name: Deploy Production

on:
  workflow_run:
    workflows: ["Build and Publish"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/laravel-aws-ci-cd

            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}

            echo "Deploying IMAGE_TAG=${IMAGE_TAG}"

            PREVIOUS_IMAGE=$(docker compose ps -q app | xargs -r docker inspect --format='{{.Config.Image}}' 2>/dev/null || true)
            PREVIOUS_TAG=$(echo "${PREVIOUS_IMAGE}" | awk -F: '{print $NF}')

            echo "Previous IMAGE_TAG=${PREVIOUS_TAG}"

            docker compose pull

            docker compose run --rm app php artisan migrate --force

            docker compose up -d --remove-orphans

            docker compose exec -T app php artisan optimize

            echo "Waiting for application health..."

            HEALTHY=false

            for i in {1..30}; do
              if curl -fsS http://localhost/up > /dev/null; then
                echo "Health check passed"
                HEALTHY=true
                break
              fi

              echo "Health check attempt $i failed"
              sleep 2
            done

            if [ "$HEALTHY" = true ]; then
              docker compose ps
              exit 0
            fi

            echo "Deployment health check failed"

            docker compose ps
            docker compose logs --tail=100 app
            docker compose logs --tail=100 nginx

            if [ -z "${PREVIOUS_TAG}" ]; then
              echo "No previous IMAGE_TAG available. Cannot rollback."
              exit 1
            fi

            echo "Rolling back to ${PREVIOUS_TAG}"

            export IMAGE_TAG=${PREVIOUS_TAG}

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T app php artisan optimize

            echo "Waiting for rollback health..."

            for i in {1..30}; do
              if curl -fsS http://localhost/up > /dev/null; then
                echo "Rollback health check passed"
                docker compose ps
                exit 1
              fi

              echo "Rollback health check attempt $i failed"
              sleep 2
            done

            echo "Rollback health check failed"

            docker compose ps
            docker compose logs --tail=100 app
            docker compose logs --tail=100 nginx

            exit 1